version: "2"
sql:
  - engine: postgresql
    queries: queries/catalog
    schema: migrations
    gen:
      go:
        package: catalogdb
        out: gen/db/catalog
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

  - engine: postgresql
    queries: queries/cart
