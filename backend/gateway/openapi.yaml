openapi: 3.1.0
info:
  title: E-Commerce Gateway
  version: 0.3.0
  description: |
    REST gateway in front of the internal gRPC services. Auth is implemented
    here directly (signup / login / logout / /me); product browsing is
    forwarded to the catalog gRPC service.

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /products:
    get:
      summary: List products with cursor pagination
      description: |
        Returns a page of products in newest-first order. Use `cursor` from a
        previous response's `next_page_cursor` to fetch the next page. The
        cursor is opaque — clients should not try to construct one.
        `page_size` defaults to 20 and is clamped to 100 by the upstream
        catalog service.
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque pagination cursor. Omit on the first page.
        - in: query
          name: page_size
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Max products per page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: Malformed query parameter.
        '502':
          description: Upstream catalog service unavailable.

  /products/{id}:
    get:
      summary: Fetch a single product by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Malformed product id.
        '404':
          description: No product with that id.
        '502':
          description: Upstream catalog service unavailable.

  /auth/signup:
    post:
      summary: Create a new user account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created. Sets a session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body or missing fields.
        '409':
          description: Email already in use.

  /auth/login:
    post:
      summary: Authenticate an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK. Sets a session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials.

  /auth/logout:
    post:
      summary: Clear the session cookie
      responses:
        '204':
          description: No content.

  /me:
    get:
      summary: Currently authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid session.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount as a canonical string (e.g. "19.9900").
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code.

    Product:
      type: object
      required: [id, name, price, inventory_available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        inventory_available:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductList:
      type: object
      required: [products, next_page_cursor]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_page_cursor:
          type: string
          description: Empty string when no more pages exist.

    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
