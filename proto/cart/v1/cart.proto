syntax = "proto3";

package cart.v1;

option go_package = "github.com/1Kyryll/ecommerce-demo/backend/gen/proto/cart/v1;cartv1";

import "google/protobuf/timestamp.proto";

service CartService {
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  rpc AddItem(AddItemRequest) returns (AddItemResponse);
  rpc RemoveItem(RemoveItemRequest) returns (RemoveItemResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
  rpc SetItemQuantity(SetItemQuantityRequest) returns (SetItemQuantityResponse);
}

message CartItem {
  string product_id = 1;
  int32 quantity = 2;
  google.protobuf.Timestamp added_at = 3;
}

message Cart {
  string id = 1;
  string user_id = 2;
  repeated CartItem items = 3;
}

message GetCartRequest  { string user_id = 1; }
message GetCartResponse { Cart cart = 1; }

message AddItemRequest {
  string user_id = 1;
  string product_id = 2;
  int32  quantity = 3;
}
message AddItemResponse { Cart cart = 1; }

message RemoveItemRequest {
  string user_id = 1;
  string product_id = 2;
}
message RemoveItemResponse { Cart cart = 1; }

message ClearCartRequest  { string user_id = 1; }
message ClearCartResponse {}

message SetItemQuantityRequest{
    string user_id = 1;
    string product_id = 2;
    int32 quantity = 3;
}
message SetItemQuantityResponse{ int32 quantity = 1; }
