syntax = "proto3";

package order.v1;

option go_package = "github.com/1Kyryll/ecommerce-demo/backend/gen/proto/order/v1;orderv1";

import "google/protobuf/timestamp.proto";

service OrderService {
  rpc CreateReservation(CreateReservationRequest) returns (CreateReservationResponse);
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message Money {
  string amount = 1;
  string currency = 2;
}

message Reservation {
  string id = 1;
  string idempotency_key = 2;
  string product_id = 3;
  string user_id = 4;
  int32  quantity = 5;
  // 'active' | 'consumed' | 'released'
  string status = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateReservationRequest {
  string idempotency_key = 1;
  string user_id = 2;
  string product_id = 3;
  int32  quantity = 4;
}

message CreateReservationResponse {
  Reservation reservation = 1;
}

message OrderItem {
  string product_id = 1;
  int32  quantity = 2;
  Money  unit_price = 3;
}

message Order {
  string id = 1;
  string idempotency_key = 2;
  string user_id = 3;
  Money  total = 4;
  string status = 5; // 'pending' | 'paid' | 'failed' | 'cancelled'
  repeated OrderItem items = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CheckoutItem {
  string product_id = 1;
  int32  quantity = 2;
}

message PlaceOrderRequest {
  string idempotency_key = 1;
  string user_id = 2;
  repeated CheckoutItem items = 3;
}

message PlaceOrderResponse {
  Order order = 1;
}

message GetOrderRequest  { string id = 1; }
message GetOrderResponse { Order order = 1; }
