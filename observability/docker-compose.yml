name: ecom-observability

networks:
  ecom-net:
    name: ecom-net
    driver: bridge

services:
  loki:
    image: grafana/loki:3.2.0
    container_name: ecom-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
