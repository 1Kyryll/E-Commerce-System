name: ecom-observability

networks:
  ecom-net:
    name: ecom-net
    driver: bridge

services:
  tempo:
    image: grafana/tempo:2.6.0
    container_name: ecom-tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.2.0
    container_name: ecom-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
