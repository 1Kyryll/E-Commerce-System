target: all,alertmanager
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9097
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir/data

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  bucket_store:
    sync_dir: /data/mimir/tsdb-sync
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/ruler

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 1000000
  max_label_names_per_series: 50
  compactor_blocks_retention_period: 168h
